<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Production eval loop in nine steps. Learn: define the product outcome, log representative traces, human error analysis, build a failure taxonomy. Measure: deterministic checks first, calibrate judges if needed, run a versioned eval suite. Watch: ship carefully and monitor, add failures to the eval set. New failures go back to step 1.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff" fill-opacity="0.85"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker>
</defs>
<rect width="1200" height="740" rx="18" fill="url(#g)"/>
<circle cx="1080" cy="40" r="140" fill="#ffffff" fill-opacity="0.05"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#ffffff">
<text x="50" y="62" font-size="30" font-weight="700">Production eval loop</text>
<g font-size="16" fill-opacity="0.9">
<circle cx="806" cy="56" r="7" fill="#5eead4"/><text x="820" y="62">Learn</text>
<circle cx="906" cy="56" r="7" fill="#93c5fd"/><text x="920" y="62">Measure</text>
<circle cx="1036" cy="56" r="7" fill="#fcd34d"/><text x="1050" y="62">Watch</text>
</g>

<g fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25">
<rect x="50" y="110" width="340" height="140" rx="14"/>
<rect x="430" y="110" width="340" height="140" rx="14"/>
<rect x="810" y="110" width="340" height="140" rx="14"/>
<rect x="810" y="300" width="340" height="140" rx="14"/>
<rect x="430" y="300" width="340" height="140" rx="14"/>
<rect x="50" y="300" width="340" height="140" rx="14"/>
<rect x="50" y="490" width="340" height="140" rx="14"/>
<rect x="430" y="490" width="340" height="140" rx="14"/>
<rect x="810" y="490" width="340" height="140" rx="14"/>
</g>

<g font-size="13" font-weight="700" letter-spacing="1.5">
<text x="72" y="144" fill="#5eead4">STEP 1</text>
<text x="452" y="144" fill="#5eead4">STEP 2</text>
<text x="832" y="144" fill="#5eead4">STEP 3</text>
<text x="832" y="334" fill="#5eead4">STEP 4</text>
<text x="452" y="334" fill="#93c5fd">STEP 5</text>
<text x="72" y="334" fill="#93c5fd">STEP 6</text>
<text x="72" y="524" fill="#93c5fd">STEP 7</text>
<text x="452" y="524" fill="#fcd34d">STEP 8</text>
<text x="832" y="524" fill="#fcd34d">STEP 9</text>
</g>

<g font-size="20" font-weight="700">
<text x="72" y="174">Define the product outcome</text>
<text x="452" y="174">Log representative traces</text>
<text x="832" y="174">Human error analysis</text>
<text x="832" y="364">Build a failure taxonomy</text>
<text x="452" y="364">Deterministic checks first</text>
<text x="72" y="364">Calibrate judges if needed</text>
<text x="72" y="554">Run a versioned eval suite</text>
<text x="452" y="554">Ship carefully and monitor</text>
<text x="832" y="554">Add failures to the eval set</text>
</g>

<g font-size="15" fill-opacity="0.82">
<text x="72" y="204">What must the user get? Name the</text>
<text x="72" y="226">failure that would cost the most.</text>
<text x="452" y="204">Real inputs and every span, tagged</text>
<text x="452" y="226">with the prompt and model version.</text>
<text x="832" y="204">A person reads 30 to 50 traces and</text>
<text x="832" y="226">notes the first thing that went wrong.</text>
<text x="832" y="394">Group the notes into 4 to 6 named</text>
<text x="832" y="416">failure modes, each with a count.</text>
<text x="452" y="394">Format, required facts and</text>
<text x="452" y="416">forbidden values run in code.</text>
<text x="72" y="394">One Pass/Fail judge per mode,</text>
<text x="72" y="416">checked against human labels.</text>
<text x="72" y="584">The same dataset on every prompt</text>
<text x="72" y="606">and model change, several runs.</text>
<text x="452" y="584">Release gate, sampled judges,</text>
<text x="452" y="606">alerts and a weekly review.</text>
<text x="832" y="584">Each failure becomes a test case</text>
<text x="832" y="606">with its expected result.</text>
</g>

<g stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M392 180 H426"/>
<path d="M772 180 H806"/>
<path d="M980 252 V296"/>
<path d="M808 370 H774"/>
<path d="M428 370 H394"/>
<path d="M220 442 V486"/>
<path d="M392 560 H426"/>
<path d="M772 560 H806"/>
</g>
<path d="M980 632 V672 H24 V180 H46" stroke="#fcd34d" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="600" y="704" font-size="16" fill-opacity="0.92" text-anchor="middle">Each new failure goes back to step 1 and sharpens the outcome, the checks and the dataset</text>
</g>
</svg>
